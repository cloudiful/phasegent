name: MCP image

# Tag-only GHCR publish for the CLI-only MCP image.
#
# - Trigger is version tags `v*` only. There is intentionally no branch
#   or pull-request trigger, so branch pushes never build or publish.
# - Logs in to GHCR with GITHUB_TOKEN (packages:write) and pushes the
#   version tag plus `latest`.
# - Multi-arch via Buildx/QEMU: linux/amd64 plus linux/arm64.
#   Single-arch fallback: if the runner forces single-arch (no QEMU or
#   the builder lacks multi-arch support), reduce `platforms` to
#   `linux/amd64` only and note the reduction in the run summary.
# - Image path derives from the repository slug at runtime
#   (`github.repository`); no owner/repo literal is baked in.
# - Checkout pins the immutable commit (`github.sha`), never a mutable ref.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  mcp-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
