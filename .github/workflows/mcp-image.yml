name: MCP image

# Tag-only GHCR publish for the CLI-only MCP image.
#
# - Trigger is version tags `v*` only. There is intentionally no branch
#   or pull-request trigger, so branch pushes never build or publish.
# - CI builds the release binary per-arch (native runners, no QEMU Rust
#   compile), stages it at `ci-image-input/phasegent`, and reuses the
#   per-arch tarballs to assemble per-arch images plus a multi-arch
#   manifest. The Dockerfile is runtime-only and copies the prebuilt
#   artifact, so no Rust toolchain or `cargo build` runs inside Docker.
# - Pushes the version tag plus `latest` to GHCR.
# - Image path derives from the repository slug at runtime
#   (`github.repository`); no owner/repo literal is baked in.
# - Checkouts pin the immutable commit (`github.sha`), never a mutable ref.
# - Per-arch correctness: each arch image copies the matching arch binary;
#   no cross-arch binary reuse.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mcp-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    needs: prepare
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "${TARGET}" --bin phasegent --no-default-features

      - name: Bundle image inputs
        shell: bash
        run: |
          rm -rf ci-image-input
          mkdir -p ci-image-input
          install -Dm755 "target/${TARGET}/release/phasegent" ci-image-input/phasegent
          tar -czf "phasegent-image-input-${{ matrix.arch }}.tar.gz" ci-image-input

      - name: Upload image input bundle
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-image-input-${{ matrix.arch }}
          path: phasegent-image-input-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs_on }}
    needs:
      - prepare
      - build-artifacts
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download image input bundle
        uses: actions/download-artifact@v8
        with:
          name: phasegent-image-input-${{ matrix.arch }}

      - name: Unpack image input bundle
        shell: bash
        run: |
          rm -rf ci-image-input
          tar -xzf "phasegent-image-input-${{ matrix.arch }}.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute architecture tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-${{ matrix.arch }}\n' "$tag"
            done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=phasegent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=phasegent-${{ matrix.arch }}

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
