name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --bin phasegent --target ${{ matrix.target }} --features postgres,notify-dingtalk,notify-email

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent phasegent-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent.exe phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe

      - name: Test Windows MSI PowerShell regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows_installer/queries.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/windows_installer/rows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/windows_installer/cleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned WiX CLI
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build and validate Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-msi.ps1 -ExecutablePath "target/${{ matrix.target }}/release/phasegent.exe" -Tag $env:GITHUB_REF_NAME -OutputPath "phasegent-$($env:GITHUB_REF_NAME)-${{ matrix.target }}.msi"

      # Explicit artifact paths only: no wildcards that could pick up
      # sidecars or build metadata.
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe
          if-no-files-found: error

      - name: Upload artifact (Windows MSI)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-windows-msi
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Checksum only intentional release artifacts (no logs/sidecars).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum phasegent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/phasegent-*-x86_64-unknown-linux-musl
            dist/phasegent-*-aarch64-apple-darwin
            dist/phasegent-*-x86_64-pc-windows-msvc.exe
            dist/phasegent-*-x86_64-pc-windows-msvc.msi
            dist/SHA256SUMS
          generate_release_notes: true
