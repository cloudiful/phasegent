name: Release

# Tag-triggered release + MCP image in one workflow. There is intentionally
# no PR CI workflow.
#
# - Trigger is version tags `v*` only; branch pushes never build or publish.
# - `version-check` fails fast unless the tag is strict numeric
#   MAJOR.MINOR.PATCH and both manifests (`Cargo.toml`, `package.json`) already
#   carry the stripped tag, so the Electron Builder MSI/DMG versions and the
#   binary `--version` agree with the release.
# - `build` compiles every release binary once with the full CLI feature set
#   (`postgres,notify-dingtalk,notify-email`). The same binary is the CLI/MCP
#   artifact and the packaged companion of the Electron desktop shell; Linux
#   stays CLI-only (no renderer, no Electron).
# - Desktop rows (Windows x64, macOS arm64) additionally build the Vue
#   renderer and the Electron main/preload bundles with Bun, stage the matching
#   Rust companion via `scripts/electron-backend.mjs`, and package the unsigned
#   MSI/DMG with Electron Builder, the only desktop packager.
# - The raw `phasegent` binaries are still published next to the installers so
#   the CLI/MCP artifact contract is unchanged.
# - The MCP image reuses the `build` Linux binaries verbatim (download the
#   matching `phasegent-<target>` artifact, stage at
#   `ci-image-input/phasegent`, docker buildx per-arch + multi-arch
#   manifest). No second `cargo build`, no QEMU Rust compile, and the image
#   binary is bit-identical to the release asset. `.dockerignore` keeps the
#   renderer and Electron outputs out of the build context, so the image stays
#   CLI-only.
# - Dockerfile stays runtime-only (copies the prebuilt artifact, no Rust
#   toolchain inside Docker). Per-arch correctness: each arch image copies
#   the matching arch binary; no cross-arch reuse.
# - Pushes the version tag plus `latest` to GHCR. Image path derives from
#   the repository slug at runtime (`github.repository`); no owner/repo
#   literal is baked in.
# - Image checkouts pin the immutable commit (`github.sha`), never a
#   mutable ref.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  version-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Electron Builder derives the Windows MSI and macOS DMG version from
      # `package.json`, and the Rust `--version` output derives from
      # `Cargo.toml`, so a tag that disagrees with either manifest must fail
      # before anything is built or published.
      - name: Assert tag and manifest versions agree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit(
                  f"Tag '{tag}' must be strict numeric MAJOR.MINOR.PATCH (for example v1.2.3)."
              )
          expected = match.group(1)
          with open("Cargo.toml", "rb") as handle:
              cargo = tomllib.load(handle)["package"]["version"]
          with open("package.json", encoding="utf-8") as handle:
              node = json.load(handle)["version"]
          if cargo != expected or node != expected:
              raise SystemExit(
                  f"Tag '{tag}' expects version {expected}: "
                  f"Cargo.toml={cargo} package.json={node}"
              )
          print(f"version-check: {tag} matches Cargo.toml and package.json ({expected})")
          PY

  build:
    needs: version-check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux stays a plain CLI/MCP binary (no renderer, no Electron),
          # but with the full CLI feature set (postgres + notify channels).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            desktop: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            desktop: false
          # macOS ships the CLI/MCP binary plus an unsigned Electron Builder
          # DMG containing the real `.app` for Finder users. No
          # signing/notarization secrets are required or set; Gatekeeper will
          # warn on first open.
          - target: aarch64-apple-darwin
            os: macos-14
            desktop: true
          # Windows ships exactly one raw exe plus one matching Electron
          # Builder MSI (x64). No ARM64 Windows package, no portable zip.
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            desktop: true
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Desktop rows build the renderer and the Electron bundles with the
      # pinned Bun toolchain through the repository's own scripts. No
      # bun.lock is committed under repository policy. Linux rows never run
      # Bun, so the CLI binary and the container image stay renderer-free.
      - name: Setup Bun (desktop rows only)
        if: matrix.desktop
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun installs (desktop rows only)
        if: matrix.desktop
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1-4-0-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1-4-0-

      - name: Install dependencies (desktop rows only)
        if: matrix.desktop
        run: bun install

      - name: Build Electron main and preload bundles (desktop rows only)
        if: matrix.desktop
        run: bun scripts/electron-build.mjs

      # `validate` runs `build-only` (vite build -> frontend/dist) plus
      # `validate-dist.mjs`, so the renderer Electron Builder embeds is the
      # same validated output the previous desktop shell used.
      - name: Build and validate renderer dist (desktop rows only)
        if: matrix.desktop
        run: bun run validate

      # The packaged companion reports the hash of the renderer it ships with,
      # so `frontend/dist` is hashed before the Rust build and passed through
      # the existing `PHASEGENT_FRONTEND_DIST_HASH` build-time variable.
      - name: Record renderer dist hash for the companion build (desktop rows only)
        if: matrix.desktop
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(bun scripts/dist-hash.mjs)"
          echo "PHASEGENT_FRONTEND_DIST_HASH=$HASH" >> "$GITHUB_ENV"
          echo "frontend/dist hash: $HASH"

      # One binary per target: the released CLI/MCP artifact and the Rust
      # companion Electron Builder stages as an extra resource.
      - name: Build release binary (CLI/MCP and desktop companion)
        run: cargo build --release --bin phasegent --target ${{ matrix.target }} --features postgres,notify-dingtalk,notify-email

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent phasegent-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent.exe phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe

      # Electron Builder packages the matching Rust companion as an extra
      # resource, then the produced unsigned DMG is staged under the
      # tag-based release contract name. The `.app` itself is distributed
      # inside the DMG, not as a separate release file.
      - name: Package macOS app and dmg with Electron Builder (unsigned)
        if: matrix.desktop && runner.os == 'macOS'
        run: |
          set -euo pipefail
          bun scripts/electron-backend.mjs --from target/${{ matrix.target }}/release/phasegent
          bun x electron-builder --config electron-builder.yml --mac dmg --publish never
          APP="$(find dist/electron -maxdepth 2 -type d -name 'phasegent.app' | head -n 1)"
          if [ -z "$APP" ]; then echo "Electron Builder produced no phasegent.app under dist/electron"; exit 1; fi
          test -f "$APP/Contents/Resources/phasegent-backend" || (echo "companion missing from the packaged .app: $APP"; exit 1)
          SRC_DMG="$(find dist/electron -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$SRC_DMG" ]; then echo "Electron Builder produced no dmg under dist/electron"; exit 1; fi
          DEST="phasegent-${{ github.ref_name }}-${{ matrix.target }}.dmg"
          cp "$SRC_DMG" "$DEST"
          ls -lh "$DEST"

      - name: Package Windows MSI with Electron Builder (unsigned)
        if: matrix.desktop && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun scripts/electron-backend.mjs --from "target/${{ matrix.target }}/release/phasegent.exe"
          bun x electron-builder --config electron-builder.yml --win msi --publish never
          $companion = 'dist/electron/win-unpacked/resources/phasegent-backend.exe'
          if (-not (Test-Path $companion)) {
            Write-Error "companion missing from the packaged app: $companion"
            exit 1
          }
          $src = Get-ChildItem -Path dist/electron -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $src) {
            Write-Error 'Electron Builder produced no msi under dist/electron'
            exit 1
          }
          $dest = "phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi"
          Copy-Item -Path $src.FullName -Destination $dest -Force
          Get-ChildItem $dest

      # Explicit artifact paths only: no wildcards that could pick up
      # `.wixpdb`, logs, zip sidecars, or Electron Builder metadata.
      - name: Upload artifact (Linux CLI)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload artifact (macOS desktop)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: |
            phasegent-${{ github.ref_name }}-${{ matrix.target }}
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows desktop)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: |
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi
          if-no-files-found: error

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  image-prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    needs:
      - build
      - image-prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Reuse the release `build` binary verbatim: no second `cargo build`.
      - name: Download release binary bundle
        uses: actions/download-artifact@v8
        with:
          name: phasegent-${{ matrix.target }}
          path: dist-image

      - name: Stage image input from release binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-image-input
          mkdir -p ci-image-input
          SRC="$(find dist-image -maxdepth 2 -type f -name "phasegent-*" | head -n 1)"
          if [ -z "$SRC" ]; then echo "release artifact missing under dist-image"; exit 1; fi
          install -Dm755 "$SRC" ci-image-input/phasegent
          ls -lh ci-image-input/phasegent

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute architecture tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-${{ matrix.arch }}\n' "$tag"
            done <<'TAGS'
          ${{ needs.image-prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.image-prepare.outputs.labels }}
          cache-from: type=gha,scope=phasegent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=phasegent-${{ matrix.arch }}

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - image-prepare
      - build-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.image-prepare.outputs.tags }}
          TAGS

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Checksum only intentional release artifacts (no logs/sidecars).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum phasegent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/phasegent-*-x86_64-unknown-linux-gnu
            dist/phasegent-*-aarch64-unknown-linux-gnu
            dist/phasegent-*-aarch64-apple-darwin
            dist/phasegent-*-aarch64-apple-darwin.dmg
            dist/phasegent-*-x86_64-pc-windows-msvc.exe
            dist/phasegent-*-x86_64-pc-windows-msvc.msi
            dist/SHA256SUMS
          generate_release_notes: true
