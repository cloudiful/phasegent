name: Release

# Tag-triggered release. There is intentionally no PR CI workflow.
#
# - Trigger is version tags `v*` only; branch pushes never build or publish.
# - `version-check` fails fast unless the tag is strict numeric
#   MAJOR.MINOR.PATCH and both manifests (`Cargo.toml`, `package.json`) already
#   carry the stripped tag, so the binary `--version` and the package manifest
#   agree with the release.
# - `build` compiles one native release binary per target with the full CLI
#   feature set (`postgres,notify-dingtalk,notify-email`) and publishes it as a
#   raw executable named `phasegent-<tag>-<target>` (`.exe` on Windows). The
#   Windows runner also builds and inspects a per-user CLI-only MSI.
# - `release` checksums those artifacts into `SHA256SUMS` and publishes them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Rust `--version` output derives from `Cargo.toml` and the package
      # manifest mirrors it, so a tag that disagrees with either manifest must
      # fail before anything is built or published.
      - name: Assert tag and manifest versions agree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit(
                  f"Tag '{tag}' must be strict numeric MAJOR.MINOR.PATCH (for example v1.2.3)."
              )
          expected = match.group(1)
          with open("Cargo.toml", "rb") as handle:
              cargo = tomllib.load(handle)["package"]["version"]
          with open("package.json", encoding="utf-8") as handle:
              node = json.load(handle)["version"]
          if cargo != expected or node != expected:
              raise SystemExit(
                  f"Tag '{tag}' expects version {expected}: "
                  f"Cargo.toml={cargo} package.json={node}"
              )
          print(f"version-check: {tag} matches Cargo.toml and package.json ({expected})")
          PY

  build:
    needs: version-check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build release binary
        run: cargo build --release --bin phasegent --target ${{ matrix.target }} --features postgres,notify-dingtalk,notify-email

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent phasegent-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent.exe phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe

      - name: Install pinned WiX CLI
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build and validate Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-msi.ps1 -ExecutablePath "target/${{ matrix.target }}/release/phasegent.exe" -Tag $env:GITHUB_REF_NAME -OutputPath "phasegent-$($env:GITHUB_REF_NAME)-${{ matrix.target }}.msi"

      # Explicit artifact paths only: no wildcards that could pick up
      # sidecars or build metadata.
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe
          if-no-files-found: error

      - name: Upload artifact (Windows MSI)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-windows-msi
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi
          if-no-files-found: error

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Checksum only intentional release artifacts (no logs/sidecars).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum phasegent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/phasegent-*-x86_64-unknown-linux-gnu
            dist/phasegent-*-aarch64-unknown-linux-gnu
            dist/phasegent-*-aarch64-apple-darwin
            dist/phasegent-*-x86_64-pc-windows-msvc.exe
            dist/phasegent-*-x86_64-pc-windows-msvc.msi
            dist/SHA256SUMS
          generate_release_notes: true
