name: Release

# Tag-triggered release + MCP image in one workflow. There is intentionally
# no PR CI workflow.
#
# - Trigger is version tags `v*` only; branch pushes never build or publish.
# - `build` compiles every release binary once with full CLI features
#   (`postgres,notify-dingtalk,notify-email`; GUI targets additionally add
#   `gui`). Linux stays CLI-only (no `gui`, no frontend build); Windows and
#   macOS add `gui` on top of the same CLI feature set. `--all-features` is
#   intentionally not used so Linux never pulls Tauri GUI dependencies.
# - The MCP image reuses the `build` Linux binaries verbatim (download the
#   matching `phasegent-<target>` artifact, stage at
#   `ci-image-input/phasegent`, docker buildx per-arch + multi-arch
#   manifest). No second `cargo build`, no QEMU Rust compile, and the image
#   binary is bit-identical to the release asset.
# - Dockerfile stays runtime-only (copies the prebuilt artifact, no Rust
#   toolchain inside Docker). Per-arch correctness: each arch image copies
#   the matching arch binary; no cross-arch reuse.
# - Pushes the version tag plus `latest` to GHCR. Image path derives from
#   the repository slug at runtime (`github.repository`); no owner/repo
#   literal is baked in.
# - Image checkouts pin the immutable commit (`github.sha`), never a
#   mutable ref.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Linux stays a plain CLI binary (no GUI, no frontend build),
          # but with the full CLI feature set (postgres + notify channels).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            gui: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            gui: false
          # macOS ships the GUI-enabled single binary plus a Tauri-built
          # unsigned .dmg containing the real `.app` for Finder users.
          # No signing/notarization secrets are required; the .dmg/.app are
          # explicitly unsigned and Gatekeeper will warn on first open.
          - target: aarch64-apple-darwin
            os: macos-14
            gui: true
          # Windows ships exactly one raw exe plus one matching MSI (x64).
          # No ARM64 Windows package, no portable zip, no .wixpdb upload.
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            gui: true
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Target-aware system dependencies: Linux stays CLI so no GTK/WebKit
      # install is needed; Windows runners provide WebView2 and macOS
      # runners provide system WebKit, so no apt/brew step is required.
      # Frontend is built with pinned Bun only for GUI targets, before the
      # Rust GUI build, using the existing package.json scripts. No
      # bun.lock is committed under repository policy.
      - name: Setup Bun (GUI builds only)
        if: matrix.gui
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun installs (GUI builds only)
        if: matrix.gui
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1-4-0-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1-4-0-

      - name: Install frontend dependencies (GUI builds only)
        if: matrix.gui
        run: bun install

      # `validate` runs `build-only` (vite build -> frontend/dist, the
      # Tauri `frontendDist`) plus `validate-dist.mjs`, keeping the Tauri
      # frontendDist/build hooks coherent with the actual frontend output.
      - name: Build frontend dist (GUI builds only)
        if: matrix.gui
        run: bun run validate

      - name: Build release binary (CLI, full CLI features)
        if: matrix.gui != true
        run: cargo build --release --bin phasegent --target ${{ matrix.target }} --features postgres,notify-dingtalk,notify-email

      - name: Build release binary (GUI-enabled single binary, Windows)
        if: matrix.gui && runner.os == 'Windows'
        run: cargo build --release --features gui,postgres,notify-dingtalk,notify-email --bin phasegent --target ${{ matrix.target }}

      # macOS GUI is built and bundled via the pinned Tauri v2 CLI so the
      # .dmg contains a real `.app` for Finder users. Unsigned: no
      # APPLE_SIGNING_IDENTITY and no notarization credentials are set or
      # required; Gatekeeper will warn on first open. The existing
      # frontend/dist (Tauri `frontendDist`) is already built above via
      # `bun run validate`, so no beforeBuildCommand is needed.
      - name: Build macOS app and dmg via Tauri (unsigned)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bun run tauri build --target ${{ matrix.target }} --features gui,postgres,notify-dingtalk,notify-email --bundles app,dmg
          echo "Tauri bundle outputs:"
          find target/${{ matrix.target }}/release/bundle -maxdepth 4 | head -n 60

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent phasegent-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent.exe phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $tools = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:PATH = "$tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix --version
          wix extension list --global

      # WiX MSI path is kept (no Tauri bundling on Windows). Single x64 MSI
      # only; portable zip creation was removed. The WiX compiler emits a
      # `.wixpdb` sidecar next to the MSI; it is deleted and never uploaded.
      # All three WiX sources (phasegent, Shortcuts, ShortcutOptionsDlg)
      # compile together so the MSI keeps the per-user Start Menu/Desktop
      # shortcut options.
      - name: Build MSI (Windows x64 only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $msiVersion = $tag -replace '^v', ''
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' must be strict numeric MAJOR.MINOR.PATCH (for example v1.2.3)."
            exit 1
          }
          $exeName = 'phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe'
          $msiName = 'phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi'
          New-Item -ItemType Directory -Force -Path msi-stage | Out-Null
          Copy-Item -Path $exeName -Destination 'msi-stage\phasegent.exe' -Force
          $wixLog = 'wix-build-${{ matrix.target }}.log'
          if (Test-Path $wixLog) { Remove-Item $wixLog -Force }
          wix build wix/phasegent.wxs wix/Shortcuts.wxs wix/ShortcutOptionsDlg.wxs -arch x64 -d SourceDir=msi-stage -d Version=$msiVersion -ext WixToolset.UI.wixext -o $msiName *>&1 | Tee-Object -FilePath $wixLog
          if ($LASTEXITCODE -ne 0) {
            $wixExit = $LASTEXITCODE
            $wixDetail = ''
            if (Test-Path $wixLog) {
              $wixLines = Get-Content -Path $wixLog | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 20
              $wixDetail = ($wixLines -join ' ')
              if ($wixDetail.Length -gt 2000) { $wixDetail = $wixDetail.Substring($wixDetail.Length - 2000) }
              $wixDetail = $wixDetail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            }
            if ([string]::IsNullOrWhiteSpace($wixDetail)) { $wixDetail = 'see wix-build log artifact' }
            Write-Output "::error::wix build failed (exit $wixExit): $wixDetail"
            exit $wixExit
          }
          # Never publish the WiX pdb sidecar or build logs on success.
          Remove-Item *.wixpdb -Force -ErrorAction SilentlyContinue
          if (Test-Path $wixLog) { Remove-Item $wixLog -Force }
          Get-ChildItem $exeName, $msiName

      # Stage the Tauri-built .dmg under the tag-based release contract name.
      # The raw GUI binary staged above is preserved alongside the .dmg to
      # keep the existing `phasegent-<tag>-<target>` contract. Only these
      # two explicit files are uploaded/published; the standalone .app
      # directory itself is distributed inside the .dmg, not as a separate
      # release file, and no logs/sidecars are published.
      - name: Stage macOS dmg to release name (unsigned)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          SRC_DMG="$(find "target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$SRC_DMG" ]; then echo "No Tauri dmg found under target/$TARGET/release/bundle/dmg"; exit 1; fi
          DEST="phasegent-${TAG}-${TARGET}.dmg"
          cp "$SRC_DMG" "$DEST"
          ls -lh "$DEST"
          echo "Standalone .app bundled inside the dmg source:"
          find "target/$TARGET/release/bundle/macos" -maxdepth 2 -name '*.app' | head -n 5
          test -n "$(find "target/$TARGET/release/bundle/macos" -maxdepth 2 -name '*.app' | head -n 1)" || (echo "Tauri .app missing; dmg would not contain a Finder app"; exit 1)

      - name: Upload WiX build log (Windows)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: wix-build-log-${{ matrix.target }}
          path: wix-build-${{ matrix.target }}.log
          if-no-files-found: warn

      # Explicit artifact paths only: no wildcards that could pick up
      # `.wixpdb`, logs, or zip sidecars.
      - name: Upload artifact (Linux CLI)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload artifact (macOS GUI)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: |
            phasegent-${{ github.ref_name }}-${{ matrix.target }}
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows GUI)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: |
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe
            phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi
          if-no-files-found: error

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  image-prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    needs:
      - build
      - image-prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Reuse the release `build` binary verbatim: no second `cargo build`.
      - name: Download release binary bundle
        uses: actions/download-artifact@v8
        with:
          name: phasegent-${{ matrix.target }}
          path: dist-image

      - name: Stage image input from release binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-image-input
          mkdir -p ci-image-input
          SRC="$(find dist-image -maxdepth 2 -type f -name "phasegent-*" | head -n 1)"
          if [ -z "$SRC" ]; then echo "release artifact missing under dist-image"; exit 1; fi
          install -Dm755 "$SRC" ci-image-input/phasegent
          ls -lh ci-image-input/phasegent

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute architecture tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-${{ matrix.arch }}\n' "$tag"
            done <<'TAGS'
          ${{ needs.image-prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.image-prepare.outputs.labels }}
          cache-from: type=gha,scope=phasegent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=phasegent-${{ matrix.arch }}

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - image-prepare
      - build-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.image-prepare.outputs.tags }}
          TAGS

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Checksum only intentional release artifacts (no logs/sidecars).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum phasegent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/phasegent-*-x86_64-unknown-linux-gnu
            dist/phasegent-*-aarch64-unknown-linux-gnu
            dist/phasegent-*-aarch64-apple-darwin
            dist/phasegent-*-aarch64-apple-darwin.dmg
            dist/phasegent-*-x86_64-pc-windows-msvc.exe
            dist/phasegent-*-x86_64-pc-windows-msvc.msi
            dist/SHA256SUMS
          generate_release_notes: true
