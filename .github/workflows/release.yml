name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            arch: amd64_arm64
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Windows ARM64 toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build release binary
        run: cargo build --release --bin phasegent --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent phasegent-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/phasegent.exe phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $tools = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:PATH = "$tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix --version
          wix extension list --global

      - name: Build MSI and portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $msiVersion = $tag -replace '^v', ''
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' must be strict numeric MAJOR.MINOR.PATCH (for example v1.2.3)."
            exit 1
          }
          $exeName = 'phasegent-${{ github.ref_name }}-${{ matrix.target }}.exe'
          $msiName = 'phasegent-${{ github.ref_name }}-${{ matrix.target }}.msi'
          $zipName = 'phasegent-${{ github.ref_name }}-${{ matrix.target }}-portable.zip'
          New-Item -ItemType Directory -Force -Path msi-stage | Out-Null
          Copy-Item -Path $exeName -Destination 'msi-stage\phasegent.exe' -Force
          $wixLog = 'wix-build-${{ matrix.target }}.log'
          if (Test-Path $wixLog) { Remove-Item $wixLog -Force }
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-msvc') {
            wix build wix/phasegent.wxs -arch x64 -d SourceDir=msi-stage -d Version=$msiVersion -ext WixToolset.UI.wixext -o $msiName *>&1 | Tee-Object -FilePath $wixLog
          } else {
            wix build wix/phasegent.wxs -arch arm64 -d SourceDir=msi-stage -d Version=$msiVersion -ext WixToolset.UI.wixext -o $msiName *>&1 | Tee-Object -FilePath $wixLog
          }
          if ($LASTEXITCODE -ne 0) {
            $wixExit = $LASTEXITCODE
            $wixDetail = ''
            if (Test-Path $wixLog) {
              $wixLines = Get-Content -Path $wixLog | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 20
              $wixDetail = ($wixLines -join ' ')
              if ($wixDetail.Length -gt 2000) { $wixDetail = $wixDetail.Substring($wixDetail.Length - 2000) }
              $wixDetail = $wixDetail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            }
            if ([string]::IsNullOrWhiteSpace($wixDetail)) { $wixDetail = 'see wix-build log artifact' }
            Write-Output "::error::wix build failed (exit $wixExit): $wixDetail"
            exit $wixExit
          }
          New-Item -ItemType Directory -Force -Path portable-stage | Out-Null
          Copy-Item -Path $exeName -Destination 'portable-stage\phasegent.exe' -Force
          Copy-Item -Path LICENSE -Destination 'portable-stage\LICENSE' -Force
          Copy-Item -Path README.md -Destination 'portable-stage\README.md' -Force
          Copy-Item -Path README.zh-CN.md -Destination 'portable-stage\README.zh-CN.md' -Force
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path 'portable-stage\*' -DestinationPath $zipName -Force
          Get-ChildItem $exeName, $msiName, $zipName

      - name: Upload WiX build log (Windows)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: wix-build-log-${{ matrix.target }}
          path: wix-build-${{ matrix.target }}.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phasegent-${{ matrix.target }}
          path: phasegent-${{ github.ref_name }}-${{ matrix.target }}*
          if-no-files-found: error

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
