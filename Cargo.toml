[package]
name = "phasegent"
version = "2.32.9"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Role-aware CLI for phase-oriented provider-backed workflows."
readme = "README.md"

[[bin]]
name = "phasegent"
path = "src/main.rs"

[features]
default = []
postgres = ["dep:sqlx"]
notify-dingtalk = ["cloudiful-notifier/dingtalk"]
notify-email = ["cloudiful-notifier/email"]

[dependencies]
async-trait = "0.1.92"
cloudiful-notifier = { version = "0.3.2", default-features = false, features = ["ntfy", "webhook"] }
console = "0.16"
directories = "6.0"
indicatif = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip"] }
rpassword = "7.5.5"
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "io-std", "io-util", "time"] }
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.49.0", features = ["filters"] }
