[package]
name = "phasegent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Role-aware CLI for phase-oriented provider-backed workflows."
readme = "README.md"

[[bin]]
name = "phasegent"
path = "src/main.rs"

[dependencies]
directories = "6.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
