[package]
name = "phasegent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Role-aware CLI for phase-oriented provider-backed workflows."
readme = "README.md"

[[bin]]
name = "phasegent"
path = "src/main.rs"

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1.89"
directories = "6.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "macros"] }
url = "2.5.8"
