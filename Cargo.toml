[package]
name = "phasegent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Role-aware CLI for phase-oriented provider-backed workflows."
readme = "README.md"

[[bin]]
name = "phasegent"
path = "src/main.rs"

[features]
default = []
gui = ["dep:tauri", "dep:tauri-build"]
postgres = ["dep:sqlx"]
notify-dingtalk = ["cloudiful-notifier/dingtalk"]
notify-email = ["cloudiful-notifier/email"]

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
cloudiful-notifier = { version = "0.3.0", default-features = false, features = ["ntfy", "webhook"] }
directories = "6.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-worker", "base64"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-util = "0.7"
toml = "1.1.5"
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "io-std", "io-util", "time"] }
url = "2.5.8"
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
